name: 데이터 자동 업데이트

on:
  schedule:
    # GitHub의 schedule 트리거는 부하 상황에 따라 몇 시간씩 지연될 수 있어서
    # (실제로 하루 9~14시간씩 밀린 사례가 반복됨), 하루 한 번만 걸어두면
    # 그 한 번이 밀렸을 때 하루 종일 데이터가 안 갱신되는 문제가 있었음.
    # 하루 4번(9/13/18/22시 KST)으로 늘려 지연되더라도 그 안에 최소 한 번은
    # 실제로 실행되도록 함.
    - cron: '0 0 * * *'   # 09:00 KST
    - cron: '0 4 * * *'   # 13:00 KST
    - cron: '0 9 * * *'   # 18:00 KST
    - cron: '0 13 * * *'  # 22:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 🔄 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 셋업
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 의존성 설치
        run: pip install requests beautifulsoup4 lxml playwright

      - name: 🌐 플레이라이트 브라우저 설치
        run: playwright install --with-deps chromium

      - name: 🕷 순위 데이터 수집
        run: python scripts/fetch_rankings.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 🔍 네이버 인기 검색어 수집
        run: python scripts/fetch_naver_trends.py
        env:
          PYTHONIOENCODING: utf-8

      - name: 🏷 무신사 프로모션 일정 동기화
        run: python scripts/fetch_partner_promotions.py

      - name: 🎟 무신사 쿠폰 프로모션 현황 동기화
        run: python scripts/fetch_coupon_promotions.py

      - name: 📧 메일 프로모션 취합 동기화
        run: python scripts/fetch_mail_promotions.py

      - name: 🔎 무신사 실시간 검색어 수집
        run: python scripts/fetch_musinsa_search_trends.py

      - name: 📈 무신사 일별 주문 통계 동기화
        run: python scripts/fetch_order_stats.py

      - name: 🏆 무신사 베스트셀러 동기화
        run: python scripts/fetch_bestsellers.py

      - name: 💾 변경사항 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "랭킹 봇"
          git add data/musinsa.json data/musinsa_male.json data/29cm.json data/naver_trends.json data/kinlock_stats.json data/musinsa_promotions.json data/musinsa_coupon_promotions.json data/mail_promotions.json data/musinsa_search_trends.json data/musinsa_order_stats.json data/musinsa_bestsellers.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "📊 랭킹 + 네이버 검색어 업데이트: $TIMESTAMP"
            git pull --rebase origin main
            git push
            echo "✅ 커밋 완료"
          fi
