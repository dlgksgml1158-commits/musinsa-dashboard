<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>무신사 × 29CM 랭킹 대시보드</title>
  <style>
    :root {
      --bg: #f1f5fb;
      --surface: #ffffff;
      --border: #e2e8f2;
      --border-strong: #c7d5ea;
      --text: #0f172a;
      --text2: #475569;
      --text3: #94a3b8;
      --blue: #2563eb;
      --blue-dim: #1d4ed8;
      --blue-light: #dbeafe;
      --blue-mid: #93c5fd;
      --coral: #f43f5e;
      --coral-light: #ffe4e6;
      --up: #10b981;
      --down: #ef4444;
      --gold: #f59e0b;
      --silver: #94a3b8;
      --bronze: #d97706;
      --shadow: 0 1px 4px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.04);
      --shadow-md: 0 2px 8px rgba(15,23,42,.08), 0 8px 24px rgba(15,23,42,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 58px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--blue);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .logo-text {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .logo-text .accent { color: var(--blue); }
    .logo-sub {
      font-size: 12px;
      color: var(--text3);
      font-weight: 400;
      border-left: 1px solid var(--border);
      padding-left: 12px;
      margin-left: 4px;
    }
    .header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text3);
    }
    .refresh-badge {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 20px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #16a34a;
      font-weight: 500;
    }
    .refresh-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #22c55e;
      animation: livepulse 2s infinite;
    }
    @keyframes livepulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── PLATFORM TABS ── */
    .platform-tabs {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
    }
    .ptab {
      padding: 0 24px;
      height: 46px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 600;
      font-size: 14px;
      color: var(--text3);
      transition: all .18s;
      display: flex;
      align-items: center;
      gap: 7px;
      user-select: none;
      letter-spacing: -0.2px;
    }
    .ptab:hover:not(.active-musinsa):not(.active-29cm) { color: var(--text2); }
    .ptab.active-musinsa { color: var(--blue); border-bottom-color: var(--blue); }
    .ptab.active-29cm { color: var(--coral); border-bottom-color: var(--coral); }
    .ptab-pip {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.7;
    }

    /* ── CATEGORY BAR ── */
    .category-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 28px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      cursor: pointer;
      white-space: nowrap;
      color: var(--text2);
      font-size: 12.5px;
      font-weight: 500;
      transition: all .15s;
      font-family: inherit;
    }
    .cat-btn:hover { border-color: var(--blue-mid); color: var(--blue); background: var(--blue-light); }
    .cat-btn.active.musinsa-active { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; }
    .cat-btn.active.cm-active { background: var(--coral); border-color: var(--coral); color: #fff; font-weight: 600; }

    /* ── MAIN LAYOUT ── */
    main {
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      max-width: 1360px;
      margin: 0 auto;
    }
    @media (max-width: 960px) { main { grid-template-columns: 1fr; padding: 16px; } }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    .section-title .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 11px;
      color: var(--text3);
    }

    /* ── RANKING CARD ── */
    .ranking-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .ranking-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ranking-card-header .title {
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }
    .period-tag {
      background: var(--blue-light);
      color: var(--blue);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #f8fafd; }
    thead th {
      padding: 9px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }
    thead th:first-child { width: 50px; text-align: center; }
    thead th.change-col { width: 58px; text-align: center; }
    thead th.price-col { width: 96px; text-align: right; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .1s;
      cursor: pointer;
    }
    tbody tr:hover { background: #f8fafd; }
    tbody tr:last-child { border-bottom: none; }
    td { padding: 11px 16px; vertical-align: middle; }

    /* Rank number */
    .rank-num { text-align: center; font-weight: 700; font-size: 15px; }
    .rank-num.rank-1 { color: var(--gold); }
    .rank-num.rank-2 { color: var(--silver); }
    .rank-num.rank-3 { color: var(--bronze); }
    .rank-num.rank-other { color: var(--text3); font-size: 13px; }

    /* Product info */
    .product-info { display: flex; align-items: center; gap: 11px; }
    .product-thumb {
      width: 42px; height: 42px;
      border-radius: 10px;
      background: var(--blue-light);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .product-name { font-weight: 600; font-size: 13px; line-height: 1.35; color: var(--text); }
    .product-brand { font-size: 11px; color: var(--text3); margin-top: 2px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }

    /* Change indicator */
    .change { text-align: center; font-size: 12px; font-weight: 700; }
    .change.up { color: var(--up); }
    .change.down { color: var(--down); }
    .change.same { color: var(--text3); }
    .change.new {
      color: var(--blue); font-size: 10px; letter-spacing: 0.5px;
      border: 1px solid var(--blue); border-radius: 4px; padding: 1px 5px;
    }

    /* Price */
    .price { text-align: right; font-weight: 600; font-size: 13px; color: var(--text); }
    .price .discount { font-size: 10px; color: var(--down); font-weight: 700; display: block; }

    /* ── SIDEBAR ── */
    .sidebar { display: flex; flex-direction: column; gap: 16px; }

    /* Brand card */
    .brand-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .brand-card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: -0.3px;
    }
    .brand-item {
      padding: 11px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-item:last-child { border-bottom: none; }
    .brand-rank-num { font-size: 12px; font-weight: 700; color: var(--text3); width: 18px; flex-shrink: 0; }
    .brand-name { font-weight: 600; font-size: 13px; flex: 1; color: var(--text); }
    .brand-count {
      font-size: 12px; color: var(--text2);
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 9px;
    }
    .brand-change { font-size: 13px; }

    /* Stats mini cards */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-mini {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .stat-value { font-size: 22px; font-weight: 700; line-height: 1; color: var(--text); }
    .stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

    /* Trend chart bar */
    .trend-item {
      padding: 9px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .trend-item:last-child { border-bottom: none; }
    .trend-label { font-size: 12px; font-weight: 600; width: 76px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text2); }
    .trend-bar-wrap { flex: 1; background: var(--bg); border-radius: 4px; height: 5px; }
    .trend-bar { height: 5px; border-radius: 4px; transition: width 0.55s ease; }
    .trend-num { font-size: 11px; color: var(--text3); width: 26px; text-align: right; }

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, #f0f4fb 25%, #e2e8f2 50%, #f0f4fb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Empty state */
    .empty-state { padding: 40px 16px; text-align: center; color: var(--text3); }
    .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--text); color: #fff;
      border-radius: 10px; padding: 11px 18px;
      font-size: 13px; box-shadow: var(--shadow-md);
      transform: translateY(80px); opacity: 0;
      transition: all .28s; z-index: 999;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* 상품 링크 */
    .product-link { color: inherit; text-decoration: none; }
    .product-link:hover .product-name { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; }

    /* ── ACCORDION ── */
    .accordion-header {
      width: 100%;
      padding: 13px 20px;
      background: #f8fafd;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--text2);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background .15s, color .15s;
      user-select: none;
    }
    .accordion-header:hover { background: var(--blue-light); color: var(--blue); }
    .accordion-header.open { color: var(--blue); }
    .accordion-header-left { display: flex; align-items: center; gap: 9px; }
    .accordion-rank-tag {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11.5px;
      color: var(--text3);
      font-weight: 600;
      transition: all .15s;
    }
    .accordion-header.open .accordion-rank-tag { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
    .accordion-chevron {
      font-size: 12px;
      transition: transform .28s ease;
      color: var(--text3);
    }
    .accordion-header.open .accordion-chevron { transform: rotate(180deg); color: var(--blue); }
    .accordion-body { max-height: 0; overflow: hidden; transition: max-height 0.36s cubic-bezier(0.4,0,0.2,1); }
    .accordion-body.open { max-height: 1400px; }
    .ranking-group table thead { display: none; }
    #rankingGroup1 table thead { display: table-header-group; }

    /* 뱃지 */
    .hot-badge {
      background: rgba(239,68,68,.12); color: var(--down);
      border: 1px solid rgba(239,68,68,.2); border-radius: 4px;
      font-size: 10px; font-weight: 700; padding: 1px 5px; margin-left: 5px;
    }
    .new-badge {
      background: var(--blue-light); color: var(--blue);
      border: 1px solid #bfdbfe; border-radius: 4px;
      font-size: 10px; font-weight: 700; padding: 1px 5px; margin-left: 5px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .platform-tabs { padding: 0; }
      .ptab { flex: 1; justify-content: center; padding: 0 12px; font-size: 13px; }
      .category-bar { padding: 8px 14px; }
      main { padding: 12px 14px; }
      .logo-sub { display: none; }
    }
    @media (max-width: 420px) {
      thead th.price-col, tbody td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-mark">📊</div>
    <div class="logo-text">무신사 <span class="accent">×</span> 29CM</div>
    <div class="logo-sub">랭킹 대시보드</div>
  </div>
  <div class="header-meta">
    <span id="lastUpdated"></span>
    <div class="refresh-badge">
      <div class="refresh-dot"></div>
      <span id="refreshTimer">Live</span>
    </div>
  </div>
</header>

<!-- PLATFORM TABS -->
<div class="platform-tabs">
  <div class="ptab active-musinsa" id="tab-musinsa" onclick="switchPlatform('musinsa')">
    <div class="ptab-pip"></div>무신사
  </div>
  <div class="ptab" id="tab-29cm" onclick="switchPlatform('29cm')">
    <div class="ptab-pip"></div>29CM
  </div>
</div>

<!-- CATEGORY BAR -->
<div class="category-bar" id="categoryBar"></div>

<!-- MAIN -->
<main>
  <!-- LEFT: 랭킹 테이블 -->
  <div>
    <div class="section-title">
      <span id="rankingTitle">실시간 랭킹</span>
      <span class="badge" id="totalCount">-</span>
    </div>
    <div class="ranking-card">
      <div class="ranking-card-header">
        <span class="title" id="categoryLabel">전체</span>
        <span class="period-tag" id="periodTag">NOW</span>
      </div>
      <!-- Group 1: 1-10위 (항상 표시) -->
      <div class="ranking-group" id="rankingGroup1">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>상품</th>
              <th class="change-col">변동</th>
              <th class="price-col">가격</th>
            </tr>
          </thead>
          <tbody id="rankingTbody1">
            <tr><td colspan="4"><div class="skeleton" style="height:52px;margin:8px 16px;"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton" style="height:52px;margin:8px 16px;"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton" style="height:52px;margin:8px 16px;"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton" style="height:52px;margin:8px 16px;"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton" style="height:52px;margin:8px 16px;"></div></td></tr>
          </tbody>
        </table>
      </div>

      <!-- 11~30위 아코디언 -->
      <button class="accordion-header" id="toggleBtnRest" onclick="toggleRest()">
        <div class="accordion-header-left">
          <span class="accordion-rank-tag">11~30위</span>
          <span style="font-size:12px;color:inherit;">펼치기</span>
        </div>
        <div class="accordion-chevron">▾</div>
      </button>
      <div class="accordion-body" id="rankingRest">
        <div class="ranking-group" id="rankingGroup2">
          <table>
            <thead>
              <tr>
                <th>순위</th><th>상품</th>
                <th class="change-col">변동</th>
                <th class="price-col">가격</th>
              </tr>
            </thead>
            <tbody id="rankingTbody2"></tbody>
          </table>
        </div>
        <div class="ranking-group" id="rankingGroup3">
          <table>
            <thead>
              <tr>
                <th>순위</th><th>상품</th>
                <th class="change-col">변동</th>
                <th class="price-col">가격</th>
              </tr>
            </thead>
            <tbody id="rankingTbody3"></tbody>
          </table>
        </div>
        <!-- 하단 접기 버튼 -->
        <button class="accordion-header" id="toggleBtnRestBottom" onclick="toggleRest()" style="display:none;">
          <div class="accordion-header-left">
            <span class="accordion-rank-tag">11~30위</span>
            <span style="font-size:12px;color:inherit;">접기</span>
          </div>
          <div class="accordion-chevron" style="transform:rotate(180deg);">▾</div>
        </button>
      </div>
    </div>
  </div>

  <!-- RIGHT: 사이드바 -->
  <div class="sidebar">
    <!-- 통계 카드 -->
    <div class="stats-grid">
      <div class="stat-mini">
        <div class="stat-label">총 노출 상품</div>
        <div class="stat-value" id="statTotal">-</div>
        <div class="stat-sub" id="statTotalSub">카테고리 합계</div>
      </div>
      <div class="stat-mini">
        <div class="stat-label">신규 진입</div>
        <div class="stat-value" style="color:var(--up)" id="statNew">-</div>
        <div class="stat-sub">이번 회차 NEW</div>
      </div>
      <div class="stat-mini">
        <div class="stat-label">최대 상승</div>
        <div class="stat-value" style="color:var(--up)" id="statTopUp">-</div>
        <div class="stat-sub" id="statTopUpBrand">-</div>
      </div>
      <div class="stat-mini">
        <div class="stat-label">최대 하락</div>
        <div class="stat-value" style="color:var(--down)" id="statTopDown">-</div>
        <div class="stat-sub" id="statTopDownBrand">-</div>
      </div>
    </div>

    <!-- 브랜드 노출 현황 -->
    <div class="brand-card">
      <div class="brand-card-header">
        <span>🏷 브랜드 노출 현황</span>
        <span style="font-size:12px;color:var(--text3);font-weight:400;">TOP10 내 집계</span>
      </div>
      <div id="brandList">
        <div class="empty-state"><p>데이터 로딩 중...</p></div>
      </div>
    </div>

    <!-- 카테고리별 분포 -->
    <div class="brand-card">
      <div class="brand-card-header">
        <span>📊 카테고리 인기도</span>
      </div>
      <div id="categoryChart">
        <div class="empty-state"><p>데이터 로딩 중...</p></div>
      </div>
    </div>
  </div>
</main>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ===========================
   CONFIG & STATE
=========================== */
const MUSINSA_CATS = [
  {code:'', label:'전체'},
  {code:'001', label:'상의'},
  {code:'002', label:'아우터'},
  {code:'003', label:'바지'},
  {code:'004', label:'원피스/스커트'},
  {code:'005', label:'스포츠'},
  {code:'020', label:'신발'},
  {code:'022', label:'가방'},
  {code:'023', label:'시계/쥬얼리'},
  {code:'024', label:'패션잡화'},
  {code:'026', label:'화장품/향수'},
];
const CM29_CATS = [
  {code:'', label:'전체'},
  {code:'women', label:'여성의류'},
  {code:'men', label:'남성의류'},
  {code:'shoes', label:'신발'},
  {code:'bag', label:'가방'},
  {code:'acc', label:'액세서리'},
  {code:'jewelry', label:'주얼리'},
  {code:'beauty', label:'뷰티'},
  {code:'life', label:'라이프'},
];

const EMOJI_BY_CAT = {
  '': '🏆', '001':'👕', '002':'🧥', '003':'👖', '004':'👗',
  '005':'🏃', '020':'👟', '022':'👜', '023':'⌚', '024':'🕶',
  '026':'💄', women:'👚', men:'👔', shoes:'👟', bag:'👜',
  acc:'💍', jewelry:'💎', beauty:'💄', life:'🏠'
};

let state = {
  platform: 'musinsa',
  category: '',
  data: { musinsa: null, '29cm': null },
  filteredItems: [],
  restOpen: false,
};

/* ===========================
   SAMPLE DATA (fallback)
=========================== */
function generateSampleData(platform) {
  const brands = platform === 'musinsa'
    ? ['커버낫','디스이즈네버댓','마르지엘라','나이키','아디다스','뉴발란스','폴로','톰브라운','우영미','앤더슨벨','아크네','스톤아일랜드','메종키츠네','오프화이트','암부시']
    : ['아더에러','엔더스키마','우영미','자크뮈스','아미','그라프','더콜디스트모먼트','마뗑킴','오이오이','로로피아나','브루넬로','꼼데가르송','이자벨마랑','가니','세쿤두스'];

  const products = [
    '오버핏 코튼 셔츠', '와이드 데님 팬츠', '울 블렌드 코트', '레더 스니커즈',
    '나일론 크로스백', '캐시미어 니트', '테크 플리스 재킷', '실크 블라우스',
    '카고 팬츠', '첼시 부츠', '미니 숄더백', '트위드 재킷', '조거 팬츠',
    '롱 트렌치코트', '메시 스니커즈', '토트백', '크롭 후드티', '스키니 진',
    '패딩 베스트', '니트 가디건'
  ];

  const prevRanks = {};
  const items = [];
  for (let i = 1; i <= 100; i++) {
    const brand = brands[Math.floor(Math.random() * brands.length)];
    const product = products[Math.floor(Math.random() * products.length)];
    const price = (Math.floor(Math.random() * 30) + 1) * 10000 + 9000;
    const discount = Math.random() > 0.5 ? Math.floor(Math.random() * 40) + 10 : 0;
    const cats = platform === 'musinsa' ? MUSINSA_CATS : CM29_CATS;
    const cat = cats[Math.floor(Math.random() * (cats.length - 1)) + 1];

    // Simulated rank change
    const changeOptions = [null, 1, 2, 3, 5, -1, -2, -3, -5, 'NEW'];
    const change = changeOptions[Math.floor(Math.random() * changeOptions.length)];

    items.push({
      rank: i,
      brand,
      name: `${brand} ${product}`,
      price,
      discountRate: discount,
      finalPrice: discount ? Math.round(price * (1 - discount / 100)) : price,
      category: cat.code,
      categoryLabel: cat.label,
      change,
      thumbnail: null,
      id: `${platform}-${i}`,
    });
  }
  return {
    platform,
    updatedAt: new Date().toISOString(),
    items,
  };
}

/* ===========================
   INIT
=========================== */
async function init() {
  await loadData('musinsa');
  await loadData('29cm');
  renderCategoryBar();
  renderRanking();
  renderSidebar();
  startRefreshTimer();
}

async function loadData(platform) {
  try {
    // Try to load real data from JSON files (populated by GitHub Actions)
    const res = await fetch(`data/${platform === 'musinsa' ? 'musinsa' : '29cm'}.json?t=${Date.now()}`);
    if (!res.ok) throw new Error('No data file');
    const json = await res.json();
    state.data[platform] = json;
    showToast(`${platform === 'musinsa' ? '무신사' : '29CM'} 데이터 로드 완료 ✓`);
  } catch {
    // Fallback to sample data
    state.data[platform] = generateSampleData(platform);
    if (platform === state.platform) {
      showToast('⚠ 샘플 데이터로 표시 중 (GitHub Actions 미실행)', 4000);
    }
  }
}

/* ===========================
   PLATFORM SWITCH
=========================== */
function switchPlatform(p) {
  state.platform = p;
  state.category = '';
  state.restOpen = false;

  document.getElementById('tab-musinsa').className = 'ptab' + (p === 'musinsa' ? ' active-musinsa' : '');
  document.getElementById('tab-29cm').className = 'ptab' + (p === '29cm' ? ' active-29cm' : '');

  renderCategoryBar();
  renderRanking();
  renderSidebar();
}

/* ===========================
   CATEGORY BAR
=========================== */
function renderCategoryBar() {
  const cats = state.platform === 'musinsa' ? MUSINSA_CATS : CM29_CATS;
  const bar = document.getElementById('categoryBar');
  bar.innerHTML = cats.map(c => `
    <button class="cat-btn ${state.category === c.code ? 'active ' + (state.platform === 'musinsa' ? 'musinsa-active' : 'cm-active') : ''}"
      onclick="selectCategory('${c.code}','${c.label}')">
      ${EMOJI_BY_CAT[c.code] || '📦'} ${c.label}
    </button>
  `).join('');
}

function selectCategory(code, label) {
  state.category = code;
  state.restOpen = false;
  renderCategoryBar();
  renderRanking();
  renderSidebar();
}

/* ===========================
   PRODUCT URL HELPER
=========================== */
function getProductUrl(item) {
  if (state.platform === '29cm') {
    if (item.productUrl) return item.productUrl;
    const numId = (item.id || '').replace(/^[^-]+-/, '');
    if (numId && !isNaN(numId)) return `https://product.29cm.co.kr/catalog/${numId}`;
    return `https://www.29cm.co.kr/search?query=${encodeURIComponent(item.brand + ' ' + item.name)}`;
  }
  // 무신사: /products/{id} 형식 사용 (구 /goods/{id}는 404)
  const numId = (item.id || '').replace(/^ms-/, '');
  if (numId && !isNaN(numId)) return `https://www.musinsa.com/products/${numId}`;
  // productUrl에서 ID 추출 시도 (검색URL 또는 구 goods URL 대응)
  const urlMatch = (item.productUrl || '').match(/\/(\d+)(?:[?#]|$)/);
  if (urlMatch) return `https://www.musinsa.com/products/${urlMatch[1]}`;
  return `https://www.musinsa.com/search/goods?keyword=${encodeURIComponent(item.name)}`;
}

/* ===========================
   RANKING TABLE
=========================== */
function getFilteredItems() {
  const d = state.data[state.platform];
  if (!d) return [];

  // 카테고리별 데이터가 있는 경우 (categories 구조)
  if (d.categories) {
    const catItems = d.categories[state.category] || d.categories[''] || [];
    return catItems.slice(0, 30);
  }

  // 기존 형식 (items 배열)
  let items = d.items || [];
  if (state.category) {
    items = items.filter(i => i.category === state.category);
  }
  return items.slice(0, 30);
}

function buildRowHtml(item, rank) {
  const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
  const changeHtml = renderChange(item.change);
  const priceHtml = item.discountRate
    ? `<span class="discount">-${item.discountRate}%</span>${item.finalPrice.toLocaleString()}원`
    : `${item.finalPrice.toLocaleString()}원`;
  const isHot = item.change !== 'NEW' && item.change !== null && item.change >= 5;
  const isNew = item.change === 'NEW';
  const url = getProductUrl(item);

  return `<tr>
    <td><div class="rank-num ${rankClass}">${rank}</div></td>
    <td>
      <div class="product-info">
        <div class="product-thumb">${EMOJI_BY_CAT[item.category] || '👔'}</div>
        <div>
          <a href="${url}" target="_blank" rel="noopener noreferrer" class="product-link">
            <div class="product-name">
              ${item.name}
              ${isHot ? '<span class="hot-badge">HOT</span>' : ''}
              ${isNew ? '<span class="new-badge">NEW</span>' : ''}
            </div>
          </a>
          <div class="product-brand">${item.brand}</div>
        </div>
      </div>
    </td>
    <td>${changeHtml}</td>
    <td><div class="price">${priceHtml}</div></td>
  </tr>`;
}

function renderGroup(tbodyId, items, startRank) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  if (items.length === 0) {
    tbody.innerHTML = `<tr><td colspan="4">
      <div class="empty-state"><div class="icon">🔍</div><p>데이터가 없습니다</p></div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = items.map((item, i) => buildRowHtml(item, startRank + i + 1)).join('');
}

function renderRanking() {
  const items = getFilteredItems();
  state.filteredItems = items;

  const cats = state.platform === 'musinsa' ? MUSINSA_CATS : CM29_CATS;
  const catLabel = cats.find(c => c.code === state.category)?.label || '전체';

  document.getElementById('categoryLabel').textContent = catLabel;
  document.getElementById('totalCount').textContent = `${items.length}개`;
  document.getElementById('rankingTitle').textContent = `${state.platform === 'musinsa' ? '무신사' : '29CM'} 실시간 랭킹`;
  document.getElementById('periodTag').textContent = 'NOW';

  // 3개 그룹으로 분할 렌더링
  renderGroup('rankingTbody1', items.slice(0, 10), 0);
  renderGroup('rankingTbody2', items.slice(10, 20), 10);
  renderGroup('rankingTbody3', items.slice(20, 30), 20);

  // 1~10위는 항상 표시, 11~30위는 아코디언
  document.getElementById('rankingGroup2').style.display = items.length > 10 ? '' : 'none';
  document.getElementById('rankingGroup3').style.display = items.length > 20 ? '' : 'none';

  // 11위 이상 데이터가 있을 때만 아코디언 헤더 노출
  const hasRest = items.length > 10;
  document.getElementById('toggleBtnRest').style.display = hasRest ? '' : 'none';
  if (!hasRest) state.restOpen = false;

  // 아코디언 열림 상태 복원 (카테고리/플랫폼 전환 시 유지)
  const restBody = document.getElementById('rankingRest');
  const restBtn = document.getElementById('toggleBtnRest');
  const restBtnBottom = document.getElementById('toggleBtnRestBottom');
  if (state.restOpen) {
    restBody.classList.add('open'); restBtn.classList.add('open');
    restBtn.style.display = 'none';
    if (restBtnBottom) restBtnBottom.style.display = '';
  } else {
    restBody.classList.remove('open'); restBtn.classList.remove('open');
    restBtn.style.display = '';
    if (restBtnBottom) restBtnBottom.style.display = 'none';
  }

  // 마지막 업데이트 시각
  const d = state.data[state.platform];
  if (d?.updatedAt) {
    const dt = new Date(d.updatedAt);
    document.getElementById('lastUpdated').textContent = `업데이트: ${dt.toLocaleString('ko-KR', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}`;
  }
}

/* ===========================
   ACCORDION (11~30위)
=========================== */
function toggleRest() {
  state.restOpen = !state.restOpen;
  const body = document.getElementById('rankingRest');
  const btn  = document.getElementById('toggleBtnRest');
  const btnBottom = document.getElementById('toggleBtnRestBottom');
  if (state.restOpen) {
    body.classList.add('open'); btn.classList.add('open');
    btn.style.display = 'none';
    if (btnBottom) btnBottom.style.display = '';
  } else {
    body.classList.remove('open'); btn.classList.remove('open');
    btn.style.display = '';
    if (btnBottom) btnBottom.style.display = 'none';
  }
}

function renderChange(change) {
  if (change === 'NEW') return '<div class="change new">NEW</div>';
  if (change === null || change === 0) return '<div class="change same">-</div>';
  if (change > 0) return `<div class="change up">▲${change}</div>`;
  return `<div class="change down">▼${Math.abs(change)}</div>`;
}

/* ===========================
   SIDEBAR
=========================== */
function renderSidebar() {
  const items = getFilteredItems();

  // Stats
  const newItems = items.filter(i => i.change === 'NEW');
  const upItems = items.filter(i => typeof i.change === 'number' && i.change > 0).sort((a,b) => b.change - a.change);
  const downItems = items.filter(i => typeof i.change === 'number' && i.change < 0).sort((a,b) => a.change - b.change);

  document.getElementById('statTotal').textContent = items.length.toLocaleString();
  document.getElementById('statNew').textContent = newItems.length;
  document.getElementById('statTopUp').textContent = upItems[0] ? `▲${upItems[0].change}` : '-';
  document.getElementById('statTopUpBrand').textContent = upItems[0]?.brand || '-';
  document.getElementById('statTopDown').textContent = downItems[0] ? `▼${Math.abs(downItems[0].change)}` : '-';
  document.getElementById('statTopDownBrand').textContent = downItems[0]?.brand || '-';

  // Brand exposure (from top 50)
  const top50 = items.slice(0, 50);
  const brandCounts = {};
  top50.forEach(i => {
    brandCounts[i.brand] = (brandCounts[i.brand] || 0) + 1;
  });
  const brandsSorted = Object.entries(brandCounts).sort((a,b) => b[1]-a[1]).slice(0, 10);

  const accentColor = state.platform === 'musinsa' ? 'var(--blue)' : 'var(--coral)';
  const accentBg = state.platform === 'musinsa' ? 'var(--blue-light)' : 'var(--coral-light)';

  document.getElementById('brandList').innerHTML = brandsSorted.length === 0
    ? '<div class="empty-state"><p>데이터 없음</p></div>'
    : brandsSorted.map(([brand, count], i) => `
      <div class="brand-item">
        <div class="brand-rank-num">${i + 1}</div>
        <div class="brand-name">${brand}</div>
        <div class="brand-count">${count}개</div>
        <div class="brand-change" style="color:${i < 3 ? accentColor : 'var(--text3)'}">
          ${i === 0 ? '👑' : i < 3 ? '●' : '○'}
        </div>
      </div>
    `).join('');

  // 브랜드 count 배지 색상 업데이트
  document.querySelectorAll('.brand-count').forEach((el, i) => {
    if (i < 3) { el.style.background = accentBg; el.style.color = accentColor; el.style.borderColor = accentColor; }
  });

  // Category chart (only for 전체 view)
  const cats = state.platform === 'musinsa' ? MUSINSA_CATS : CM29_CATS;
  const catData = cats.slice(1).map(c => ({
    label: c.label,
    count: items.filter(i => i.category === c.code).length,
  })).filter(c => c.count > 0).sort((a,b) => b.count-a.count).slice(0, 8);

  const maxCount = Math.max(...catData.map(c => c.count), 1);
  document.getElementById('categoryChart').innerHTML = catData.length === 0
    ? '<div class="empty-state"><p>전체 카테고리 선택 시 표시됩니다</p></div>'
    : catData.map(c => `
      <div class="trend-item">
        <div class="trend-label">${c.label}</div>
        <div class="trend-bar-wrap">
          <div class="trend-bar" style="width:${Math.round(c.count/maxCount*100)}%;background:${accentColor};opacity:0.8;"></div>
        </div>
        <div class="trend-num">${c.count}</div>
      </div>
    `).join('');
}

/* ===========================
   AUTO REFRESH
=========================== */
// 매일 오전 9시(KST) 기준 갱신 — 다음 오전 9시까지 카운트다운
function nextNineAM() {
  const now = new Date();
  const t = new Date();
  t.setHours(9, 0, 0, 0);
  if (now >= t) t.setDate(t.getDate() + 1);
  return t;
}

function startRefreshTimer() {
  let target = nextNineAM();
  let lastReload = Date.now();
  const pad = n => n.toString().padStart(2, '0');

  setInterval(async () => {
    const now = Date.now();
    let diff = Math.floor((target - now) / 1000);

    if (diff <= 0) {
      // 오전 9시 도달 → 새 데이터 로드 (워크플로우 배포 반영)
      target = nextNineAM();
      await loadData(state.platform);
      renderRanking();
      renderSidebar();
      showToast('🔄 오전 9시 랭킹 갱신 완료');
      lastReload = now;
      diff = Math.floor((target - Date.now()) / 1000);
    } else if (now - lastReload > 10 * 60 * 1000) {
      // 9시 직후 Pages 배포 지연 대응: 10분마다 조용히 최신 데이터 반영
      lastReload = now;
      await loadData(state.platform);
      renderRanking();
      renderSidebar();
    }

    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    const s = diff % 60;
    document.getElementById('refreshTimer').textContent =
      `${pad(h)}:${pad(m)}:${pad(s)} 후 갱신`;
  }, 1000);
}

/* ===========================
   TOAST
=========================== */
function showToast(msg, dur = 2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ===========================
   START
=========================== */
init();
</script>
